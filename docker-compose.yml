version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: examen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: examen_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d examen_db"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examen_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/examen_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      # Access token corto (2 min) para evidenciar la renovación transparente;
      # el refresh token dura 30 min y se rota (renueva) en cada uso.
      JWT_EXPIRATION_MS: 120000
      JWT_REFRESH_EXPIRATION_MS: 1800000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Límite de inactividad (3 min) y antelación del aviso (30 s). Son valores
        # de cliente (NEXT_PUBLIC_) y se fijan en tiempo de build.
        NEXT_PUBLIC_INACTIVITY_TIMEOUT_MS: 180000
        NEXT_PUBLIC_INACTIVITY_WARNING_MS: 30000
    container_name: examen_frontend
    restart: unless-stopped
    environment:
      # URL interna del backend (red docker). Solo la usa el proxy de Next.js;
      # el navegador únicamente habla con http://localhost:3000/api/...
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    name: examen_app_network
    driver: bridge

volumes:
  postgres_data:
    name: examen_postgres_data
